<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Scheduled maintenance</title>
<style>
:root{--bg:#f6f7f9;--fg:#3c4043;--mut:#80868b;--card:#fff;--line:#e3e5e8}
@media(prefers-color-scheme:dark){:root{--bg:#1b1c1f;--fg:#dadce0;--mut:#9aa0a6;--card:#25262a;--line:#34363b}}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:15px/1.6 "Segoe UI",Roboto,system-ui,sans-serif;display:flex;align-items:center;justify-content:center;padding:16px}
.box{max-width:420px;width:100%;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:32px 28px;text-align:center}
svg{width:56px;height:56px;color:var(--mut);margin-bottom:12px}
h1{font-size:19px;font-weight:600;margin:0 0 8px}p{margin:0;color:var(--mut);font-size:14px}
</style></head><body>
<div class="box">
 <svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="32" cy="32" r="24"/><path d="M32 18v15l9 6"/></svg>
 <h1>Scheduled maintenance</h1>
 <p>This site is temporarily unavailable while we make some updates. Please check back later.</p>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script>
/* Keeps the session. When an admin turns the decoy OFF for this account, the student is sent back automatically. */
(function(){
  var DEV;try{DEV=localStorage.getItem("qr_device")||""}catch(e){DEV=""}
  var sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY,{global:{headers:{"x-device-id":DEV}}});
  function check(){
    sb.auth.getSession().then(function(r){
      if(!r.data.session){location.replace("login.html");return}
      sb.rpc("my_decoy").then(function(x){if(x&&x.data===false)location.replace("index.html")},function(){});
    });
  }
  check();setInterval(check,10000);
})();
</script>
</body></html>
