<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>My courses</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--acc:#9b30c9;--navy:#1e2a5a;--mut:#7b7f8e;--line:#e4e7ee}
*{box-sizing:border-box}html,body{margin:0}
body{font:15px/1.6 Montserrat,"Segoe UI",system-ui,sans-serif;color:#222436;background:#edf0f8;min-height:100vh;
  background-image:linear-gradient(#cfdcec,#cfdcec);background-repeat:no-repeat;background-size:100% 93px}
.tab{position:absolute;top:0;left:0;width:240px;height:3px;background:#fff;border-radius:0 0 12px 0}
.wrap{max-width:1500px;margin:0 auto;padding:9px 47px 40px}
.panel{background:#fff;border-radius:18px;padding:40px 42px 42px;box-shadow:0 1px 3px #0001}
h1{font-size:clamp(26px,3vw,40px);font-weight:500;margin:0 0 28px;color:#1d1f2e}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:22px}
.course{border:1px solid var(--line);border-left:8px solid var(--acc);border-radius:14px 12px 12px 14px;padding:26px 24px 30px;min-height:240px;cursor:pointer;background:#fff;transition:box-shadow .15s}
.course:hover{box-shadow:0 4px 14px #0001}
.code{font-size:13px;font-weight:700;letter-spacing:.09em;color:#6e3d8f;text-transform:uppercase;margin-bottom:16px}
.course h2{font-size:clamp(20px,1.7vw,26px);font-weight:500;color:var(--navy);margin:0 0 12px;line-height:1.3}
.course p{margin:0;color:var(--mut);font-size:15px;line-height:1.55}
.crumb{font-size:13px;color:var(--mut);margin-bottom:14px}.crumb a{color:#5b3b86;cursor:pointer;text-decoration:none}.crumb a:hover{text-decoration:underline}
.sec{border:1px solid var(--line);border-left:6px solid var(--acc);border-radius:12px;padding:16px 20px;margin-bottom:12px;cursor:pointer;display:flex;justify-content:space-between;gap:12px;align-items:center}
.sec:hover{box-shadow:0 3px 10px #0001}.sec b{color:var(--navy);font-weight:600}.sec small{color:var(--mut);display:block;font-weight:400}
.tag{font-size:11px;background:#efe6f6;color:#6e3d8f;border-radius:10px;padding:2px 10px;font-weight:600;white-space:nowrap}
.doc{max-width:860px;line-height:1.7}.doc h3{color:var(--navy);margin:26px 0 8px;font-size:18px;font-weight:600}
.doc p,.doc li{color:#2d3040}.doc ul{padding-left:22px}
.box{background:#f5f0fa;border-left:4px solid var(--acc);border-radius:8px;padding:12px 16px;margin:12px 0;font-size:14.5px}
.f{font-family:Cambria,"Times New Roman",serif;font-size:17px;background:#f7f8fb;border:1px solid var(--line);border-radius:8px;padding:8px 14px;margin:10px 0;overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px;margin:10px 0}th,td{border:1px solid var(--line);padding:7px 10px;text-align:left}th{background:#f3eef8;color:var(--navy)}
.nav{display:flex;justify-content:space-between;margin-top:30px;gap:10px}
.nav button{font:inherit;font-weight:600;border:0;border-radius:8px;padding:9px 16px;background:#efe6f6;color:#6e3d8f;cursor:pointer}
@media(max-width:640px){.wrap{padding:8px 10px 30px}.panel{padding:24px 18px}}
</style></head><body>
<div class="tab"></div>
<div class="wrap"><div class="panel" id="root"></div></div>

<script>
var C=[
{code:"DS2 26-1",title:"DS2_26-1",desc:"Discrete Probability Part 2",items:[
 {t:"Reviewer 1: Conditional Probability and Independence",s:"Definitions, multiplication rule, independent events",h:
 '<h3>Conditional probability</h3><p>The probability of A given that B has occurred (with P(B) &gt; 0):</p><div class="f">P(A | B) = P(A ∩ B) / P(B)</div><p>Rearranged, this gives the <b>multiplication rule</b>: P(A ∩ B) = P(B) · P(A | B).</p>'+
 '<h3>Independent events</h3><p>A and B are independent when knowing one does not change the other:</p><div class="f">P(A ∩ B) = P(A) · P(B) &nbsp;⇔&nbsp; P(A | B) = P(A)</div><div class="box"><b>Do not confuse</b> independent with mutually exclusive. Mutually exclusive events with positive probability are never independent, because P(A ∩ B) = 0.</div>'+
 '<h3>Example</h3><p>Two cards are drawn without replacement from a standard deck. P(both aces) = (4/52)(3/51) = 1/221.</p>'},
 {t:"Reviewer 2: Bayes’ Theorem",s:"Total probability, Bayes’ rule, worked example",h:
 '<h3>Law of total probability</h3><p>If A₁, …, Aₙ partition the sample space:</p><div class="f">P(B) = Σ P(B | Aᵢ) · P(Aᵢ)</div><h3>Bayes’ theorem</h3><div class="f">P(Aⱼ | B) = P(B | Aⱼ) · P(Aⱼ) / Σ P(B | Aᵢ) · P(Aᵢ)</div>'+
 '<h3>Worked example</h3><p>A test detects a disease 95% of the time when present, and gives a false positive 4% of the time. 1% of people have the disease. Given a positive test:</p><div class="f">P(D | +) = (0.95)(0.01) / [(0.95)(0.01) + (0.04)(0.99)] ≈ 0.193</div><p>Even with a positive result, the chance of having the disease is only about 19%, because the disease is rare.</p>'},
 {t:"Reviewer 3: Random Variables, Expectation and Variance",s:"E(X), linearity, V(X), Bernoulli, binomial, geometric",h:
 '<h3>Expected value</h3><div class="f">E(X) = Σ x · p(x)</div><p><b>Linearity:</b> E(X + Y) = E(X) + E(Y), always, even if X and Y are dependent. Also E(aX + b) = aE(X) + b.</p>'+
 '<h3>Variance</h3><div class="f">V(X) = E(X²) − [E(X)]²</div><p>If X and Y are independent, V(X + Y) = V(X) + V(Y). Also V(aX + b) = a²V(X).</p>'+
 '<h3>Common distributions</h3><table><tr><th>Distribution</th><th>P(X = k)</th><th>E(X)</th><th>V(X)</th></tr><tr><td>Bernoulli(p)</td><td>p if k = 1; 1 − p if k = 0</td><td>p</td><td>p(1 − p)</td></tr><tr><td>Binomial(n, p)</td><td>C(n,k) pᵏ (1 − p)ⁿ⁻ᵏ</td><td>np</td><td>np(1 − p)</td></tr><tr><td>Geometric(p)</td><td>(1 − p)ᵏ⁻¹ p</td><td>1/p</td><td>(1 − p)/p²</td></tr></table>'+
 '<div class="box"><b>Example:</b> A fair coin is flipped 10 times. P(exactly 4 heads) = C(10,4)(1/2)¹⁰ = 210/1024 ≈ 0.205.</div>'}
]},
{code:"CSAM 211",title:"Ordinary Differential Equations 26-1",desc:"Second and Higher Order Linear Homogeneous DE",items:[
 {t:"Reviewer 1: Constant-Coefficient Homogeneous Equations",s:"Characteristic equation and the three root cases",h:
 '<h3>Setup</h3><p>For <b>a y″ + b y′ + c y = 0</b>, try y = e<sup>mx</sup>. This gives the characteristic equation:</p><div class="f">a m² + b m + c = 0</div>'+
 '<h3>Case 1: distinct real roots m₁, m₂</h3><div class="f">y = C₁ e<sup>m₁x</sup> + C₂ e<sup>m₂x</sup></div><h3>Case 2: repeated real root m</h3><div class="f">y = (C₁ + C₂ x) e<sup>mx</sup></div><h3>Case 3: complex roots α ± βi</h3><div class="f">y = e<sup>αx</sup> (C₁ cos βx + C₂ sin βx)</div>'+
 '<h3>Examples</h3><ul><li>y″ − 5y′ + 6y = 0 → m = 2, 3 → y = C₁e²ˣ + C₂e³ˣ</li><li>y″ + 4y′ + 4y = 0 → m = −2 (twice) → y = (C₁ + C₂x)e⁻²ˣ</li><li>y″ + 2y′ + 5y = 0 → m = −1 ± 2i → y = e⁻ˣ(C₁ cos 2x + C₂ sin 2x)</li></ul>'},
 {t:"Reviewer 2: Higher-Order Equations",s:"Repeated and complex roots of higher multiplicity",h:
 '<h3>Method</h3><p>For an nth-order equation, the characteristic equation is a polynomial of degree n. Factor it, then build the general solution from every root.</p>'+
 '<ul><li>A real root m of multiplicity k contributes: e<sup>mx</sup>, x e<sup>mx</sup>, …, x<sup>k−1</sup> e<sup>mx</sup>.</li><li>A complex pair α ± βi of multiplicity k contributes e<sup>αx</sup> cos βx, e<sup>αx</sup> sin βx, each multiplied by 1, x, …, x<sup>k−1</sup>.</li></ul>'+
 '<h3>Examples</h3><ul><li>y‴ − 6y″ + 11y′ − 6y = 0 → (m − 1)(m − 2)(m − 3) = 0 → y = C₁eˣ + C₂e²ˣ + C₃e³ˣ</li><li>y⁗ − 2y″ + y = 0 → (m² − 1)² = 0 → m = 1, 1, −1, −1 → y = (C₁ + C₂x)eˣ + (C₃ + C₄x)e⁻ˣ</li></ul>'},
 {t:"Reviewer 3: Linear Independence, Wronskian and IVPs",s:"Checking solution sets, initial conditions",h:
 '<h3>Wronskian</h3><p>For two solutions y₁, y₂ of a second-order equation:</p><div class="f">W(y₁, y₂) = y₁ y₂′ − y₂ y₁′</div><p>If W ≠ 0 on an interval, the solutions are linearly independent and form a fundamental set.</p>'+
 '<h3>Initial value problems</h3><p>Find the general solution first, then use the initial conditions to solve for the constants. An nth-order equation needs n conditions.</p><div class="box"><b>Example:</b> y″ − 3y′ + 2y = 0, y(0) = 1, y′(0) = 0. Roots m = 1, 2, so y = C₁eˣ + C₂e²ˣ. Then C₁ + C₂ = 1 and C₁ + 2C₂ = 0, giving C₂ = −1 and C₁ = 2. So y = 2eˣ − e²ˣ.</div>'}
]},
{code:"CCCS 104",title:"Data Structures and Algorithms 26-1",desc:"Graphs, Searching, Sorting and Hashing",items:[
 {t:"Reviewer 1: Graphs",s:"Representations, BFS, DFS, shortest paths",h:
 '<h3>Representations</h3><table><tr><th></th><th>Adjacency matrix</th><th>Adjacency list</th></tr><tr><td>Space</td><td>O(V²)</td><td>O(V + E)</td></tr><tr><td>Edge check</td><td>O(1)</td><td>O(degree)</td></tr><tr><td>Best for</td><td>Dense graphs</td><td>Sparse graphs</td></tr></table>'+
 '<h3>Traversals</h3><ul><li><b>BFS</b> uses a queue, visits level by level, and finds shortest paths in unweighted graphs. O(V + E).</li><li><b>DFS</b> uses a stack or recursion, goes deep before backtracking. O(V + E). Used for cycle detection and topological sort.</li></ul>'+
 '<h3>Shortest paths</h3><p><b>Dijkstra’s algorithm</b> works for non-negative weights; with a min-heap it runs in O((V + E) log V).</p>'},
 {t:"Reviewer 2: Searching and Sorting",s:"Linear and binary search, complexity table",h:
 '<h3>Searching</h3><ul><li><b>Linear search:</b> O(n), works on any list.</li><li><b>Binary search:</b> O(log n), requires a sorted array. Compare with the middle element, then discard half.</li></ul>'+
 '<h3>Sorting</h3><table><tr><th>Algorithm</th><th>Best</th><th>Average</th><th>Worst</th><th>Stable</th></tr><tr><td>Bubble</td><td>O(n)</td><td>O(n²)</td><td>O(n²)</td><td>Yes</td></tr><tr><td>Selection</td><td>O(n²)</td><td>O(n²)</td><td>O(n²)</td><td>No</td></tr><tr><td>Insertion</td><td>O(n)</td><td>O(n²)</td><td>O(n²)</td><td>Yes</td></tr><tr><td>Merge</td><td>O(n log n)</td><td>O(n log n)</td><td>O(n log n)</td><td>Yes</td></tr><tr><td>Quick</td><td>O(n log n)</td><td>O(n log n)</td><td>O(n²)</td><td>No</td></tr><tr><td>Heap</td><td>O(n log n)</td><td>O(n log n)</td><td>O(n log n)</td><td>No</td></tr></table>'},
 {t:"Reviewer 3: Hashing",s:"Hash functions, load factor, collision handling",h:
 '<h3>Basics</h3><p>A hash function maps a key to a table index, for example h(k) = k mod m. Average search, insert and delete are O(1).</p><div class="f">load factor α = n / m</div>'+
 '<h3>Collision handling</h3><ul><li><b>Separate chaining:</b> each slot holds a linked list of keys. Average lookup is O(1 + α).</li><li><b>Open addressing:</b> probe for another slot. <i>Linear probing</i> tries h(k)+1, +2, …; <i>quadratic probing</i> tries h(k)+i²; <i>double hashing</i> uses a second hash function for the step size.</li></ul>'+
 '<div class="box"><b>Example:</b> Insert 12, 22, 32 into a table of size 10 with h(k) = k mod 10 and linear probing. All hash to 2, so they land in slots 2, 3 and 4.</div>'}
]}];

var root=document.getElementById("root");
function home(){
  root.innerHTML='<h1>My courses</h1><div class="grid">'+C.map(function(c,i){return'<div class="course" data-c="'+i+'"><div class="code">'+c.code+'</div><h2>'+c.title+'</h2><p>'+c.desc+'</p></div>'}).join("")+'</div>';
  scrollTo(0,0);
}
function course(i){
  var c=C[i];
  root.innerHTML='<div class="crumb"><a data-go="home">My courses</a> / '+c.code+'</div><h1>'+c.title+'</h1>'+c.items.map(function(x,j){return'<div class="sec" data-c="'+i+'" data-r="'+j+'"><div><b>'+x.t+'</b><small>'+x.s+'</small></div><span class="tag">Reviewer</span></div>'}).join("");
  scrollTo(0,0);
}
function reviewer(i,j){
  var c=C[i],x=c.items[j];
  root.innerHTML='<div class="crumb"><a data-go="home">My courses</a> / <a data-c="'+i+'" data-go="course">'+c.code+'</a> / Reviewer</div><div class="doc"><h1 style="font-size:clamp(22px,2.4vw,30px)">'+x.t+'</h1>'+x.h+
   '<div class="nav"><button '+(j?'data-c="'+i+'" data-r="'+(j-1)+'"':'disabled style="opacity:.4"')+'>← Previous</button><button '+(j<c.items.length-1?'data-c="'+i+'" data-r="'+(j+1)+'"':'disabled style="opacity:.4"')+'>Next →</button></div></div>';
  scrollTo(0,0);
}
root.onclick=function(e){
  var g=e.target.closest("[data-go]");
  if(g){if(g.dataset.go==="home")home();else course(+g.dataset.c);return}
  var n=e.target.closest("[data-c]");if(!n||n.disabled)return;
  if(n.dataset.r!==undefined)reviewer(+n.dataset.c,+n.dataset.r);else course(+n.dataset.c);
};
home();
</script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script>
/* Keeps the session. When an admin turns the decoy OFF for this account, the student is sent back automatically. */
(function(){
  var DEV;try{DEV=localStorage.getItem("qr_device")||""}catch(e){DEV=""}
  var sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY,{global:{headers:{"x-device-id":DEV}}});
  function check(){
    sb.auth.getSession().then(function(r){
      if(!r.data.session){location.replace("login.html");return}
      sb.rpc("my_decoy").then(function(x){if(x&&x.data===false)location.replace("index.html")},function(){});
    });
  }
  check();setInterval(check,10000);
})();
</script>
</body></html>
