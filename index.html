<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Q Review</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%239b30c9'/%3E%3Ctext x='32' y='47' font-size='42' font-family='Arial,sans-serif' font-weight='700' text-anchor='middle' fill='white'%3EQ%3C/text%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eef1f7; --band:#cfdcec; --card:#ffffff; --fg:#222436; --muted:#7b7f92; --line:#e6e9f1;
  --link:#2a3566; --accent:#9b30c9; --accent-soft:#e6dff0; --accent-ink:#6b4a8a; --icon:#c2487a;
  --chev:#cfe0f1; --sec:#8a3a9f; --ok:#1a7f37; --bad:#c62828;
}
*{box-sizing:border-box}
body{margin:0;font-family:Montserrat,system-ui,sans-serif;background:var(--bg);color:var(--fg);font-size:15px;line-height:1.5}
button{font:inherit;cursor:pointer;border:0}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.band{background:var(--band);height:96px}
.wrap{max-width:980px;margin:-56px auto 48px;padding:0 16px}
.card{background:var(--card);border-radius:14px;padding:28px;box-shadow:0 2px 10px rgba(30,40,80,.08);position:relative}
.btn{border-radius:8px;padding:10px 18px;font-weight:500;font-size:14px}
.back{background:#a9bfe6;color:#1d2b4f;margin-bottom:14px}
.primary{background:var(--accent);color:#fff}
.ghost{background:var(--accent-soft);color:var(--accent-ink)}
.ghost[disabled]{opacity:.45;cursor:default}

/* ---------- course page ---------- */
.section-head{display:flex;align-items:center;gap:18px;background:none;width:100%;text-align:left;padding:4px 0}
.chev{width:38px;height:38px;border-radius:9px;background:var(--chev);display:grid;place-items:center;flex:none;color:#1d2b4f;transition:transform .15s}
.section-head[aria-expanded="false"] .chev{transform:rotate(-90deg)}
.section-head h2{font-size:28px;font-weight:500;margin:0;color:var(--fg)}
.section-head.minor{padding:14px 0 4px 4px}
.section-head.minor .chev{background:none;width:24px;height:24px;color:var(--sec)}
.section-head.minor h2{font-size:22px;color:var(--sec);font-weight:500}
.acts{list-style:none;margin:10px 0 0;padding:0}
.act{display:flex;align-items:center;gap:16px;padding:16px 4px;border-bottom:1px solid var(--line)}
.act:last-child{border-bottom:0}
.act svg.ico{flex:none;width:34px;height:34px;color:var(--icon)}
.act .main{flex:1;min-width:0}
.act .name{display:inline;font-size:17px;color:var(--link);background:none;padding:0;text-align:left;font-weight:500}
.act .name:hover{text-decoration:underline}
.act .dates{font-size:13px;color:var(--muted);margin-top:2px}
.act .dates b{color:var(--fg);font-weight:600;margin-right:4px}
.act .dates span+span{margin-left:14px}
.bul{margin:8px 0 6px;padding:0 0 12px 40px;font-size:13px;color:var(--link);border-bottom:1px solid var(--line)}
.bul li{margin:2px 0}
.secnote{font-size:13px;margin:10px 4px 4px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.act svg.ico.res{color:#2f8f9d}
.state{flex:none}
.done-pill{background:#eef2f6;color:var(--ok);border-radius:8px;padding:6px 12px;font-size:13px;font-style:italic;display:inline-flex;gap:6px;align-items:center}
.mark{background:none;color:var(--accent-ink);font-style:italic;font-size:13px;padding:6px 8px}
.mark:hover{text-decoration:underline}
.empty{color:var(--muted);font-size:14px;padding:10px 8px 6px 32px;font-style:italic}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#2a3566;color:#fff;padding:10px 18px;border-radius:10px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:30;max-width:90vw}
.toast.show{opacity:1}

/* ---------- quiz ---------- */
.timer{position:absolute;right:20px;top:-18px;background:#bfe3e3;border-radius:22px;padding:6px 8px 6px 16px;display:flex;gap:14px;align-items:center;font-size:14px;font-variant-numeric:tabular-nums}
.timer.low{background:#f6c6c6}
.timer button{background:#e8f4f4;border-radius:14px;padding:4px 12px;font-size:14px;font-weight:500}
.qh{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
h2.qt{font-weight:500;font-size:30px;margin:10px 0 14px}
.flag{background:#fff;border:1px solid #ddd;border-radius:8px;padding:6px 12px;font-size:13px;color:#7a2c9c;text-decoration:underline}
.flag.on{background:#fbe8ff}
.meta{display:flex;gap:30px;flex-wrap:wrap;font-size:13px;padding:14px 4px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.q{padding:26px 4px 8px;font-size:15px}
.q p{margin:0 0 6px;max-width:72ch}
.opt{display:flex;align-items:center;gap:12px;margin:14px 0 0 18px;font-size:15px;cursor:pointer}
.opt input{width:18px;height:18px;accent-color:var(--accent)}
.opt input.txt{border:1px solid #ccc;border-radius:6px;padding:8px 10px;width:min(280px,100%);height:auto;font:15px Montserrat,sans-serif;margin-left:8px}
.nav{display:flex;justify-content:space-between;margin-top:30px;gap:12px}
.jump{display:flex;gap:8px;justify-content:center;margin-top:26px;flex-wrap:wrap}
.jump button{width:34px;height:34px;border-radius:6px;border:1px solid #bbb;background:#fff;font-size:13px}
.jump button.done{background:#cfe9d4}
.jump button.cur{outline:2px solid var(--accent)}
.score{font-size:42px;font-weight:500;margin:4px 0}
.rev{display:flex;flex-direction:column;gap:12px;margin:18px 0}
.rev .it{border:1px solid var(--line);border-left-width:5px;border-radius:10px;padding:12px 16px}
.rev .it.ok{border-left-color:var(--ok)} .rev .it.no{border-left-color:var(--bad)}
.rev .tag{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.rev .ok .tag{color:var(--ok)} .rev .no .tag{color:var(--bad)}
.rev p{margin:4px 0;font-size:14px}
.mgrid{display:flex;flex-direction:column;gap:14px;margin-top:16px}.mrow{display:flex;align-items:center;gap:18px;flex-wrap:wrap}.mfig svg{display:block;width:230px;max-width:100%;height:auto;border:1px solid var(--line);border-radius:8px;background:#fafafa}.msel{font:14px Montserrat,sans-serif;padding:8px 10px;border:1px solid #bbb;border-radius:8px;background:#f3f4f8;min-width:130px}
.overlay{position:fixed;inset:0;background:rgba(10,10,30,.5);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
.dialog{background:#fff;border-radius:14px;max-width:420px;width:100%;padding:24px}
.dialog h3{margin:0 0 8px;font-weight:500;font-size:20px}
.dialog p{margin:0 0 18px}
.dialog .row{display:flex;justify-content:flex-end;gap:10px}
h3.sum{font-weight:500;font-size:20px;margin:0 0 14px}
.tw{overflow-x:auto}
.st{border-collapse:collapse;width:100%;min-width:300px}
.st th,.st td{text-align:left;padding:12px 14px;border-bottom:1px solid var(--line)}
.st th{background:#e8eef8;font-weight:600;font-size:14px}
.st a{color:var(--accent);text-decoration:underline}
.st .rec{color:var(--ok)} .st .norec{color:var(--bad)}
.fm{color:var(--accent);font-size:12px;margin-left:10px}
.cnt{font-size:14px;color:var(--muted);margin:14px 0 0}
.sc{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:22px}
.tokrow{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:18px}
.tokin{border:1px solid #ccc;border-radius:6px;padding:12px 14px;font:600 18px Montserrat,sans-serif;letter-spacing:.12em;text-transform:uppercase;width:min(260px,100%)}
.tokmsg{color:var(--bad);font-size:14px!important;min-height:1.4em;margin:14px 0 0!important}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.ccard{display:flex;flex-direction:column;gap:6px;text-align:left;background:#fff;border:1px solid var(--line);border-left:5px solid var(--accent);border-radius:10px;padding:18px;min-width:0}
.ccard:hover{background:#f6f3fb}
.ccode{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--accent-ink)}
.cname{font-size:18px;font-weight:500;color:var(--link)}
.cnote{font-size:13px;color:var(--muted)}
.rt{border-collapse:collapse;margin:0 0 22px;font-size:14px}
.rt th{text-align:left;font-weight:400;background:#f1f3f6;padding:8px 22px 8px 12px;border:1px solid #dfe3ea;white-space:nowrap}
.rt td{padding:8px 14px;border:1px solid #dfe3ea}
.rq{display:flex;gap:16px;border:1px solid #dfe3ea;margin-bottom:14px}
.rinfo{flex:0 0 130px;background:#f1f3f6;padding:12px;font-size:13px;border-right:1px solid #dfe3ea}
.rn{font-size:14px;margin-bottom:6px}.rn b{font-size:18px}
.rs,.rm{margin-bottom:4px}
.rbody{flex:1;min-width:0;padding:12px 14px 14px 0;font-size:15px}
.rbody p{margin:0 0 10px}
.ra{color:#444}
.rfb{background:#e3eefa;padding:10px 12px;font-size:14px}
.flink{color:#1c4fa3}
@media(max-width:560px){.rq{flex-direction:column;gap:0}.rinfo{flex:none;border-right:0;border-bottom:1px solid #dfe3ea}.rbody{padding:12px}.rt th{white-space:normal}}
.sec{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 22px 10px;margin-bottom:16px}
.sec .section-head h2{font-size:24px}
.sec .chev{width:34px;height:34px}
.todo{background:#fff;border:1px solid #cfd5df;border-radius:6px;padding:5px 10px;font-size:13px;display:inline-flex;gap:6px;align-items:center;color:var(--fg)}
.lock{display:flex;align-items:center;gap:8px;background:#e8ebf0;border-radius:999px;padding:5px 12px;font-size:12.5px;margin-top:8px;color:#333;min-width:0}
.lock svg{flex:none}
.lock .lt{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lock.open{border-radius:14px;align-items:flex-start}
.lock.open .lt{white-space:normal}
.lock .sm{background:none;font-size:12.5px;font-weight:600;color:var(--fg);display:inline-flex;gap:5px;align-items:center;flex:none}
.info{padding:40px 36px}
.info p{margin:0 0 22px;font-size:17px}
.reattempt{background:#0a2d7a;color:#fff;border-radius:6px;padding:13px 16px;font-size:17px;margin-bottom:26px}
.yat{font-weight:500;font-size:34px;margin:44px 0 12px}
.attempt{border:1px solid var(--line);border-radius:10px;padding:16px 20px}
.attempt+.attempt{margin-top:14px}
.attempt h3{font-weight:500;font-size:28px;margin:0 0 16px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);border-radius:10px;padding:12px 18px;font-size:19px;min-width:0}
.chip small{display:block;font-size:14px;margin-bottom:6px}
.info .np{margin:22px 0 4px}
@media(max-width:560px){.info{padding:20px 16px}.chip{font-size:16px}.yat{font-size:26px}.card{padding:18px}.section-head h2{font-size:22px}.act{align-items:flex-start;flex-wrap:wrap}.state{margin-left:50px}.timer{right:12px}h2.qt{font-size:24px}}
.eq{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:18px 0 0 18px;font-size:17px}
.slot{min-width:64px;height:40px;border:1px solid #999;border-radius:4px;display:inline-grid;place-items:center;background:#fff;font-size:16px;cursor:pointer;padding:0 8px}
.slot.over{background:var(--accent-soft);border-color:var(--accent)}
.bank{display:flex;flex-wrap:wrap;gap:8px;margin:26px 0 0 18px}
.tile{border:1px solid #888;background:#f1f3f6;padding:8px 14px;border-radius:4px;font-size:16px;cursor:grab;min-width:46px;text-align:center;user-select:none}
.tile.used{visibility:hidden}
.ro{display:flex;align-items:center;gap:12px;margin:8px 0 0 18px;padding:8px 12px;border-radius:8px;border:1px solid transparent;font-size:15px}
.ro input{width:18px;height:18px;flex:none;accent-color:var(--accent)}
.ro.right{background:#d6f0dc;border-color:#1a7f37;font-weight:500}
.ro.wrong{background:#fde2e2;border-color:#c62828}
.ro .rk{margin-left:auto;font-size:12px;font-weight:600;white-space:nowrap}
.ro.right .rk,.ro.right>.rk{color:#1a7f37}.ro.wrong .rk{color:#c62828}
.slot.gok{background:#d6f0dc;border-color:#1a7f37}.slot.gbad{background:#fde2e2;border-color:#c62828}
.rbody .opt.ro{margin-left:18px}
.viewans{background:#fff;color:#0a2d7a;border:2px solid #0a2d7a;display:block;margin-bottom:26px}
.srch{display:flex;align-items:center;gap:12px;margin:0 0 16px}
.srch input{flex:1;min-width:0;border:1px solid #ccc;border-radius:8px;padding:10px 14px;font:15px Montserrat,sans-serif}
.qc{font-size:13px;color:var(--muted);white-space:nowrap}
.qn{color:var(--muted);font-size:14px;margin:6px 0 14px}
.srch input{animation:srchpulse 2.2s ease-in-out infinite}
.srch input:focus{animation:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.srch input:not(:placeholder-shown){animation:none}
@keyframes srchpulse{0%,100%{border-color:#ccc;box-shadow:0 0 0 0 rgba(155,48,201,0)}50%{border-color:var(--accent);box-shadow:0 0 0 4px rgba(155,48,201,.18)}}
.srch input::placeholder{color:var(--accent-ink);opacity:.85}
@media(prefers-reduced-motion:reduce){.srch input{animation:none}}
.tg{width:22px;height:22px;flex:none;border:2px solid #b5b9c6;background:#fff;display:inline-grid;place-items:center;transition:background .2s}
.tg.rad{border-radius:50%}.tg.chk{border-radius:5px}
.tg.on{background:#1a7f37;border-color:#1a7f37;animation:tgpop .35s ease-out}
.tg.on::after{content:"\2713";color:#fff;font-size:14px;font-weight:700;line-height:1}
.tg.bad{background:#c62828;border-color:#c62828}
.tg.bad::after{content:"\2715";color:#fff;font-size:12px;font-weight:700;line-height:1}
@keyframes tgpop{0%{transform:scale(.6)}60%{transform:scale(1.2)}100%{transform:scale(1)}}
@media(prefers-reduced-motion:reduce){.tg.on{animation:none}}
.ordnote{background:#fff8e1;border:1px solid #f0d78a;border-left:5px solid #e0a800;border-radius:8px;padding:12px 16px;font-size:14px;margin:0 0 16px;color:#4a3b00}
.ccard.locked{position:relative;cursor:not-allowed;overflow:hidden;border-left-color:#b8b3c2}
.ccard.locked:hover{background:#fff}
.ccard.locked .cblur{display:flex;flex-direction:column;gap:6px;filter:blur(5px);opacity:.6;user-select:none;pointer-events:none}
.ccard.locked .clock{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:#4a4f66;background:rgba(255,255,255,.35)}
.clt{font-size:12px;font-weight:600;letter-spacing:.04em}
.q svg,.rbody svg{max-width:100%;height:auto}
@media(max-width:560px){.wrap{padding:0 10px}.opt{margin-left:4px;gap:10px}.opt input.txt{font-size:16px;width:100%;margin-left:0}.nav{flex-wrap:wrap}.nav .btn{flex:1 1 40%;padding:12px}.jump button{width:40px;height:40px}.mfig svg{width:100%}.msel{min-width:0;flex:1}.meta{gap:10px 20px}.btn{padding:12px 16px}}
</style>
</head>
<body>
<div class="band"></div>
<div class="wrap" id="root"></div>
<div class="toast" id="toast" role="status"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script>
/* ---------------- data ---------------- */
var PRE=[];
var POST=[];
var PRE4=[];
var POST4=[];
var PRE5=[];
var POST5=[];
var ODE1=[];
var ODE2=[];
var META={def:{limit:"10 mins",secs:600,method:"Highest grade",pass:"4.00 out of 5.00",grade:5},
  dsa_lt1:{limit:"30 mins",secs:1800,method:"Last attempt",pass:"Not specified",grade:100},
  ode_q1:{limit:"30 mins",secs:1800,method:"Last attempt",pass:"8.00 out of 10.00",grade:10},
  ode_q2:{limit:"30 mins",secs:1800,method:"Last attempt",pass:"8.00 out of 10.00",grade:10}};
function mt(k){return META[k]||META.def;}
function tot(qs){return qs.reduce(function(a,q){return a+(q.w||1);},0);}
function dropAns(i){var n=Q[i].lab.length,d=S.ans[i];return(d&&d.length===n)?d.slice():new Array(n).fill(-1);}
function matchAns(i){var n=Q[i].frames.length,d=S.ans[i];return(d&&d.length===n)?d.slice():new Array(n).fill(-1);}
var Q=PRE;
var QS={pre:PRE,post:POST,pre4:PRE4,post4:POST4,pre5:PRE5,post5:POST5,ode_q1:ODE1,ode_q2:ODE2};
var TITLES={pre:"Pretest: Module 3 - Discrete Probability Part 2",post:"Posttest: Module 3 - Discrete Probability Part 2",pre4:"Pretest: Module 4 - Sequences & Recursions",post4:"Posttest: Module 4 - Sequences & Recursions",pre5:"Pretest: Module 5 - Graphs & Trees",post5:"Posttest: Module 5 - Graphs & Trees",ode_q1:"Quiz (Higher Order Linear Homogeneous DE)",ode_q2:"Quiz (Homogeneous Linear Second - Order De Using The Method Of Reduction By Order)"};
var TOTAL=600;
var S={view:"course",k:null,open:{main:true,seq:false,graphs:false,final:false},
  done:{pre:false,post:true,assign:false},scores:{pre:null,post:null},started:false,finished:false,timeUp:false,
  cur:0,left:TOTAL,hide:false,confirm:false,score:0,
  ans:PRE.map(function(q){return q.type==="text"?"":[];}),flag:PRE.map(function(){return false;})};
var A={};
var H={pre:[],post:[],pre4:[],post4:[],pre5:[],post5:[],ode_q1:[],ode_q2:[]};
function saveAtt(){if(!S.k)return;A[S.k]={startedAt:S.startedAt,cur:S.cur,left:S.left,hide:S.hide,finished:S.finished,score:S.score,timeUp:S.timeUp,ans:S.ans,flag:S.flag};}
function loadAtt(a){S.startedAt=a.startedAt;S.cur=a.cur;S.left=a.left;S.hide=a.hide;S.finished=a.finished;S.score=a.score;S.timeUp=a.timeUp;S.ans=a.ans;S.flag=a.flag;S.confirm=false;}
function sc(k){return S.scores[k]==null?"":'<span><b>Score:</b>'+S.scores[k]+' / '+tot(QS[k])+'</span>';}
var tick=null, root=document.getElementById("root");

/* ---------------- helpers ---------------- */
function $(id){return document.getElementById(id);}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
function fmt(s){return "0:"+String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0");}
function answered(i){if(Q[i].type==="match")return matchAns(i).some(function(x){return x>-1;});if(Q[i].type==="drop")return dropAns(i).some(function(x){return x>-1;});return Q[i].type==="text"?S.ans[i].trim()!=="":S.ans[i].length>0;}
function correct(i){var q=Q[i];if(q.type==="match"){var m=matchAns(i);return m.every(function(x,k){return x===q.a[k];});}if(q.type==="drop"){var d=dropAns(i);return d.every(function(x,s){return x>-1&&q.o[x]===q.o[q.a[s]];});}
  if(q.type==="text")return S.ans[i].trim()===q.a;
  return S.ans[i].length===q.a.length&&q.a.every(function(x){return S.ans[i].indexOf(x)>-1;});}
function toast(msg){var t=$("toast");t.textContent=msg;t.classList.add("show");clearTimeout(toast.h);toast.h=setTimeout(function(){t.classList.remove("show");},2200);}
function resetQuiz(){S.cur=0;S.left=TOTAL;S.hide=false;S.confirm=false;S.finished=false;S.started=false;
  S.ans=Q.map(function(q){return q.type==="text"?"":[];});S.flag=Q.map(function(){return false;});}

var CHEV='<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 6l4.5 4.5L12.5 6"/></svg>';
var QUIZ_ICO='<svg class="ico" viewBox="0 0 34 34" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="28" height="26" rx="5"/><path d="M15 12h10M15 17h10M15 22h10"/><circle cx="10" cy="12" r="1.2"/><circle cx="10" cy="17" r="1.2"/><circle cx="10" cy="22" r="1.2"/></svg>';
var ASSIGN_ICO='<svg class="ico" viewBox="0 0 34 34" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 3H9a3 3 0 0 0-3 3v22a3 3 0 0 0 3 3h16a3 3 0 0 0 3-3V11z"/><path d="M20 3v8h8"/><path d="M17 25v-9M13 19.5l4-4 4 4"/></svg>';

var usedMem=[];
function hash(str){var h1=0xdeadbeef,h2=0x41c6ce57;for(var i=0;i<str.length;i++){var ch=str.charCodeAt(i);h1=Math.imul(h1^ch,2654435761);h2=Math.imul(h2^ch,1597334677);}
  h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);
  h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);
  return (4294967296*(2097151&h2)+(h1>>>0)).toString(36);}
function usedList(){try{var v=JSON.parse(localStorage.getItem("usedTokens")||"[]");return v.concat(usedMem);}catch(e){return usedMem;}}
function markUsed(h){usedMem.push(h);try{var v=JSON.parse(localStorage.getItem("usedTokens")||"[]");v.push(h);localStorage.setItem("usedTokens",JSON.stringify(v));}catch(e){}}

function renderToken(msg){
  root.innerHTML=
  '<div class="card info"><h2 class="qt">Enter access token</h2>'+
  '<p style="font-size:15px;color:var(--muted)">Enter a token to open the course. Each token works one time only.</p>'+
  '<form id="tf" class="tokrow"><input id="tok" class="tokin" type="text" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="XXXX-XXXX" aria-label="Access token">'+
  '<button class="reattempt" style="margin:0" type="submit">Verify token</button></form>'+
  '<p class="tokmsg" id="tm" role="alert">'+esc(msg)+'</p></div>';
  $("tok").focus();
  $("tf").onsubmit=function(e){
    e.preventDefault();
    var raw=$("tok").value.toUpperCase().replace(/[^A-Z0-9]/g,"");
    if(!raw){renderToken("Enter your token.");return;}
    var h=hash(raw);
    if(TOK.indexOf(h)<0){renderToken("Invalid token. Check it and try again.");return;}
    if(usedList().indexOf(h)>-1){renderToken("This token was already used. Enter a new one.");return;}
    markUsed(h);S.view="course";renderCourse();window.scrollTo(0,0);
  };
}
function beginQuiz(key){
  S.k=key;Q=QS[key];TOTAL=mt(key).secs;

function startTimer(){
  if(tick)return;
  tick=setInterval(function(){
    S.left--;
    if(S.left<=0){S.left=0;finish(true);return;}
    var t=$("time");if(t)t.textContent=fmt(S.left);
    var tm=$("timer");if(tm)tm.classList.toggle("low",S.left<=60);
  },1000);
}
function stopTimer(){clearInterval(tick);tick=null;}
function leaveQuiz(){stopTimer();S.confirm=false;saveAtt();S.view="course";renderCourse();window.scrollTo(0,0);}

function renderQuiz(){
  var i=S.cur,q=Q[i],last=i===Q.length-1,body="";
  if(q.type==="text"){
    body='<div class="opt">Answer:<input class="txt" type="text" id="txt" value="'+esc(S.ans[i])+'"></div>';
  }else if(q.type==="drop"){
    var d=dropAns(i);
    body='<div class="eq">'+q.lab.map(function(l,s){return '<span class="slot" data-s="'+s+'" tabindex="0" title="Click to remove">'+(d[s]>-1?esc(q.o[d[s]]):"")+'</span><span>'+l+'</span>';}).join("")+'</div>'+
      '<div class="bank">'+q.o.map(function(o,k){return '<span class="tile'+(d.indexOf(k)>-1?" used":"")+'" draggable="true" data-t="'+k+'">'+esc(o)+'</span>';}).join("")+'</div>';
  }else if(q.type==="match"){
    body=matchBody(i);
  }else{
    body=q.o.map(function(o,k){
      return '<label class="opt"><input type="'+(q.type==="radio"?"radio":"checkbox")+'" name="o" data-i="'+k+'"'+(S.ans[i].indexOf(k)>-1?" checked":"")+'>'+String.fromCharCode(97+k)+'. '+esc(o)+'</label>';

  }

   '<div class="timer'+(S.left<=60?" low":"")+'" id="timer"><span>&#9201; <b id="time">'+fmt(S.left)+'</b></span><button id="hide" type="button">Hide</button></div>'+
   '<div class="qh"><h2 class="qt">Question '+(i+1)+'</h2>'+
   '<button class="flag'+(S.flag[i]?" on":"")+'" id="flag" type="button">&#9873; '+(S.flag[i]?"Remove flag":"Flag question")+'</button></div>'+
   '<div class="meta"><span id="status">'+(answered(i)?"Answer saved":"Not yet answered")+'</span><span>Marked out of '+(q.w||1).toFixed(2)+'</span></div>'+
   '<div class="q"><p>'+esc(q.t)+'</p>'+(q.fig||"")+body+'</div>'+
   '<div class="nav">'+(i>0?'<button class="btn ghost" id="prev" type="button">Previous page</button>':'<span></span>')+
   '<button class="btn primary" id="next" type="button">'+(last?"Finish attempt ...":"Next page")+'</button></div>'+
   '<div class="jump">'+Q.map(function(_,k){return '<button type="button" class="'+(answered(k)?"done":"")+' '+(k===i?"cur":"")+'" data-j="'+k+'" aria-label="Question '+(k+1)+'">'+(k+1)+'</button>';}).join("")+'</div>'+
  '</div>'+(S.confirm?confirmHTML():"");

  $("back").onclick=leaveQuiz;
  $("hide").onclick=function(e){var t=$("time").parentNode,h=t.style.display==="none";t.style.display=h?"":"none";e.target.textContent=h?"Hide":"Show";};
  $("flag").onclick=function(){S.flag[i]=!S.flag[i];renderQuiz();};
  var p=$("prev");if(p)p.onclick=function(){S.cur--;renderQuiz();};
  $("next").onclick=function(){if(last){S.view="summary";renderSummary();window.scrollTo(0,0);}else{S.cur++;renderQuiz();}};
  root.querySelectorAll("[data-j]").forEach(function(b){b.onclick=function(){S.cur=+b.dataset.j;renderQuiz();};});
  root.querySelectorAll("input[name=o]").forEach(function(el){
    el.onchange=function(){
      var k=+el.dataset.i;
      if(q.type==="radio")S.ans[i]=[k];
      else S.ans[i]=el.checked?S.ans[i].concat([k]):S.ans[i].filter(function(x){return x!==k;});
      $("status").textContent="Answer saved";refreshJump();
    };
  });
  if(q.type==="drop"){
    var put=function(k,s){var d=dropAns(i),o=d.indexOf(k);if(o>-1)d[o]=-1;d[s]=k;S.ans[i]=d;renderQuiz();};
    root.querySelectorAll(".tile").forEach(function(el){

    });
    root.querySelectorAll(".slot").forEach(function(el){
      el.onclick=function(){var d=dropAns(i);d[+el.dataset.s]=-1;S.ans[i]=d;renderQuiz();};
      el.ondragover=function(e){e.preventDefault();el.classList.add("over");};

      el.ondrop=function(e){e.preventDefault();var k=parseInt(e.dataTransfer.getData("text/plain"),10);if(!isNaN(k))put(k,+el.dataset.s);};

  var t=$("txt");if(t)t.oninput=function(){S.ans[i]=t.value;$("status").textContent=answered(i)?"Answer saved":"Not yet answered";refreshJump();};
  if(S.confirm){$("cancel").onclick=function(){S.confirm=false;renderQuiz();};$("ok").onclick=function(){finish(false);};$("ok").focus();}
}
function renderSummary(){
  var rows=Q.map(function(_,i){
    var ok=answered(i);
    return '<tr><td><a href="#" data-q="'+i+'">'+(i+1)+'</a>'+(S.flag[i]?'<span class="fm">&#9873; Flagged</span>':'')+'</td>'+
      '<td class="'+(ok?"rec":"norec")+'">'+(ok?"Answer saved":"Not yet answered")+'</td></tr>';
  }).join("");
  var n=Q.filter(function(_,i){return answered(i);}).length;
  root.innerHTML=
  '<button class="btn back" id="back" type="button">Back</button>'+
  '<div class="card"><div class="timer'+(S.left<=60?" low":"")+'" id="timer"><span>&#9201; <b id="time">'+fmt(S.left)+'</b></span><button id="hide" type="button">Hide</button></div>'+
  '<h2 class="qt">'+esc(TITLES[S.k])+'</h2><h3 class="sum">Summary of attempt</h3>'+
  '<div class="tw"><table class="st"><thead><tr><th>Question</th><th>Status</th></tr></thead><tbody>'+rows+'</tbody></table></div>'+
  '<p class="cnt">'+n+' of '+Q.length+' answered</p>'+
  '<div class="sc"><button class="btn ghost" id="ret" type="button">Return to attempt</button>'+
  '<button class="btn primary" id="sub" type="button">Submit all and finish</button></div></div>'+(S.confirm?confirmHTML():"");
  $("back").onclick=leaveQuiz;
  $("hide").onclick=function(e){var t=$("time").parentNode,h=t.style.display==="none";t.style.display=h?"":"none";e.target.textContent=h?"Hide":"Show";};
  $("ret").onclick=function(){S.cur=Q.length-1;S.view="quiz";renderQuiz();window.scrollTo(0,0);};
  $("sub").onclick=function(){S.confirm=true;renderSummary();};
  root.querySelectorAll("a[data-q]").forEach(function(a){a.onclick=function(e){e.preventDefault();S.cur=+a.dataset.q;S.view="quiz";renderQuiz();window.scrollTo(0,0);};});
  if(S.confirm){$("cancel").onclick=function(){S.confirm=false;renderSummary();};$("ok").onclick=function(){finish(false);};$("ok").focus();}
}
function matchBody(i){var q=Q[i],d=matchAns(i);
  return '<div class="mgrid">'+q.frames.map(function(f,k){
    return '<div class="mrow"><div class="mfig">'+f+'</div><select class="msel" data-m="'+k+'" aria-label="Frame '+(k+1)+'"><option value="-1">Choose...</option>'+
    q.o.map(function(o,j){return '<option value="'+j+'"'+(d[k]===j?' selected':'')+'>'+esc(o)+'</option>';}).join('')+'</select></div>';}).join('')+'</div>';}
function refreshJump(){root.querySelectorAll("[data-j]").forEach(function(b){b.classList.toggle("done",answered(+b.dataset.j));});}
function confirmHTML(){
  var left=Q.filter(function(_,k){return !answered(k);}).length;
  return '<div class="overlay"><div class="dialog" role="dialog" aria-modal="true"><h3>Submit all and finish</h3>'+
  '<p>You will not be able to change your answers after submitting.'+(left?' You have '+left+' unanswered question'+(left>1?"s":"")+'.':"")+'</p>'+
  '<div class="row"><button class="btn ghost" id="cancel" type="button">Cancel</button><button class="btn primary" id="ok" type="button">Submit all and finish</button></div></div></div>';
}
function finish(timeUp){
  stopTimer();S.confirm=false;S.finished=true;S.done[S.k]=true;
  S.score=Q.reduce(function(s,q,i){return s+(correct(i)?(q.w||1):0);},0);
  S.scores[S.k]=S.score;S.timeUp=!!timeUp;saveAtt();saveAttemptDB();
  H[S.k].push({score:S.score,ans:JSON.parse(JSON.stringify(S.ans)),started:S.startedAt,completed:new Date(),secs:TOTAL-S.left});
  S.view="review";renderReview();window.scrollTo(0,0);
}
function show(i){
  var q=Q[i],a=S.ans[i];
  if(!answered(i))return "No answer";
  if(q.type==="match")return matchAns(i).map(function(x){return x>-1?q.o[x]:"-";}).join(", ");
  if(q.type==="text")return a;
  if(q.type==="drop")return dropAns(i).map(function(x){return x>-1?q.o[x]:"(blank)";}).join(", ");
  return a.slice().sort().map(function(k){return q.o[k];}).join(", ");
}
function right(i){var q=Q[i];if(q.type==="match")return q.a.map(function(x){return q.o[x];}).join(", ");if(q.type==="drop")return q.a.map(function(x){return q.o[x];}).join(", ");return q.type==="text"?q.a:q.a.map(function(k){return q.o[k];}).join(" or ");}
function dt(d){return d.toLocaleString("en-US",{weekday:"long",year:"numeric",month:"long",day:"numeric",hour:"numeric",minute:"2-digit"}).replace(" at ",", ");}
function renderInfo(){
  var k=S.k,list=H[k];
  var btn=(A[k]&&!A[k].finished)?"Continue your attempt":(list.length?"Re-attempt quiz":"Attempt quiz");
  var atts=list.map(function(h,n){
    return '<div class="attempt"><h3>Attempt '+(n+1)+'</h3><div class="chips">'+
    '<div class="chip"><small>Status</small>Finished</div>'+
    '<div class="chip"><small>Started</small>'+dt(h.started)+'</div>'+
    '<div class="chip"><small>Completed</small>'+dt(h.completed)+'</div>'+
    '<div class="chip"><small>Duration</small>'+Math.floor(h.secs/60)+' mins '+(h.secs%60)+' secs</div></div>'+
    '<p class="np"><a href="#" class="flink" data-rv="'+n+'">Review</a></p></div>';
  }).join("");
  root.innerHTML=
  '<button class="btn back" id="back" type="button">Back to course</button>'+
  '<div class="card info"><button class="reattempt" id="re" type="button" style="margin-bottom:12px;display:block">'+btn+'</button>'+
  '<button class="reattempt viewans" id="va" type="button">View answers</button>'+
  '<p>Time limit: '+mt(k).limit+'</p><p>Grading method: '+mt(k).method+'</p><p>Grade to pass: '+mt(k).pass+'</p>'+
  (list.length?'<h2 class="yat">Your attempts</h2>'+atts:'')+'</div>';
  $("back").onclick=function(){S.view="course";renderCourse();window.scrollTo(0,0);};
  $("re").onclick=function(){
    var cont=A[k]&&!A[k].finished;
    var ov=document.createElement("div");ov.className="overlay";ov.id="atov";
    ov.innerHTML='<div class="dialog" role="dialog" aria-modal="true"><h3>'+(cont?"Continue your attempt?":"Are you sure you want to attempt this quiz?")+'</h3>'+
      (cont?'<p>Your timer will keep running from where you left off.</p>':
      '<p>This quiz has a time limit of <b>'+mt(k).limit+'</b> and <b>'+Q.length+' question'+(Q.length>1?"s":"")+'</b>. The timer starts as soon as you begin and cannot be paused. When time is up, your attempt is submitted automatically.</p>'+
      '<p style="font-size:14px;color:var(--muted)">Grading method: '+mt(k).method+'. Make sure you are ready before you start.</p>')+
      '<div class="row"><button class="btn ghost" id="atno" type="button">Cancel</button><button class="btn primary" id="atyes" type="button">'+(cont?"Continue":"Start attempt")+'</button></div></div>';
    document.body.appendChild(ov);
    $("atyes").focus();
    $("atno").onclick=function(){ov.remove();};
    ov.onclick=function(e){if(e.target===ov)ov.remove();};
    $("atyes").onclick=function(){ov.remove();if(A[k]&&A[k].finished)A[k]=null;beginQuiz(k);};
  };
  $("va").onclick=function(){logEvent("view_answers");S.view="answers";renderAnswers();window.scrollTo(0,0);};
  root.querySelectorAll("[data-rv]").forEach(function(a){a.onclick=function(e){e.preventDefault();logEvent("view_review");S.view="review";renderReview(+a.dataset.rv);window.scrollTo(0,0);};});
}
function ordNote(){return '<div class="ordnote"><b>Note:</b> The order of the questions and answer choices in your actual quiz may be different from what you see here. Always check the <b>actual answer text</b>, not the letter (a, b, c&hellip;).</div>';}
function searchBox(){return '<div class="srch"><input id="qs" type="search" placeholder="Search question..." aria-label="Search questions" autocomplete="off"><span id="qc" class="qc"></span></div><p id="qn" class="qn" style="display:none">No matching questions.</p>';}
function bindSearch(){
  var inp=$("qs");if(!inp)return;
  var rows=root.querySelectorAll(".rq");
  var hints=["Search question...","Type a keyword to find a question"];
  var reduce=window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  if(!reduce){
    var hi=0,ci=0,del=false,wait=0;
    var tm=setInterval(function(){
      if(!document.body.contains(inp)){clearInterval(tm);return;}
      if(document.activeElement===inp||inp.value){inp.placeholder="Search question...";return;}
      if(wait>0){wait--;return;}
      var h=hints[hi];
      if(!del){ci++;inp.placeholder=h.slice(0,ci)+"\u258f";if(ci>=h.length){del=true;wait=18;}}
      else{ci-=2;if(ci<=0){ci=0;del=false;hi=(hi+1)%hints.length;inp.placeholder="\u258f";}else inp.placeholder=h.slice(0,ci)+"\u258f";}
    },60);
  }else inp.placeholder="Search question...";
  inp.oninput=function(){
    var v=inp.value.trim().toLowerCase(),n=0;
    rows.forEach(function(r){var qp=r.querySelector(".rbody p"),m=!v||(qp&&qp.textContent.toLowerCase().indexOf(v)>-1);r.style.display=m?"":"none";if(m)n++;});
    $("qn").style.display=(v&&!n)?"":"none";
    $("qc").textContent=v?n+" of "+rows.length:"";
  };
}
function revBody(q,i){
  var a=S.ans[i],h="";
  if(q.type==="match"){
    var m=(a&&a.length===q.frames.length)?a:q.frames.map(function(){return -1;});
    return '<div class="mgrid">'+q.frames.map(function(f,k){var ok=m[k]===q.a[k];
      return '<div class="mrow"><div class="mfig">'+f+'</div><div class="ro '+(ok?'right':(m[k]>-1?'wrong':''))+'" style="margin:0">'+(m[k]>-1?'Your answer: '+esc(q.o[m[k]])+' ':'')+'<span class="rk">&#10003; Correct: '+esc(q.o[q.a[k]])+'</span></div></div>';}).join('')+'</div>';
  }
  if(q.type==="text"){
    var ok=a.trim()===q.a;
    return '<div class="opt ro'+(ok?' right':(a.trim()?' wrong':''))+'">Answer:<input class="txt" type="text" disabled value="'+esc(a)+'"></div>'+
      '<div class="ro right"><span class="rk">&#10003;</span>Correct answer: '+esc(q.a)+'</div>';
  }
  if(q.type==="drop"){
    return '<div class="eq">'+q.lab.map(function(l,s2){
      return '<span class="slot gok">'+esc(q.o[q.a[s2]])+'</span><span>'+l+'</span>';}).join("")+'</div>';
  }
  var isR=q.type==="radio";
  h=q.o.map(function(o,k){
    var sel=a.indexOf(k)>-1,cor=q.a.indexOf(k)>-1;
    var cls=cor?' right':(sel?' wrong':'');
    return '<div class="ro'+cls+'"><span class="tg '+(isR?"rad":"chk")+(cor?" on":(sel?" bad":""))+'" aria-hidden="true"></span>'+String.fromCharCode(97+k)+'. '+esc(o)+
      (cor?'<span class="rk">&#10003; Correct</span>':(sel?'<span class="rk">&#10007; Your answer</span>':''))+'</div>';
  }).join("");
  return h;
}
function renderAnswers(){
  var old=S.ans;S.ans=Q.map(function(q){return q.type==="text"?"":[];});
  var qs=Q.map(function(q,i){
    return '<div class="rq"><div class="rinfo"><div class="rn">Question <b>'+(i+1)+'</b></div>'+
      '<div class="rm">Marked out of '+(q.w||1).toFixed(2)+'</div></div>'+
      '<div class="rbody"><p>'+esc(q.t)+'</p>'+(q.fig||"")+revBody(q,i)+'</div></div>';
  }).join("");
  S.ans=old;
  root.innerHTML=
  '<button class="btn back" id="back" type="button">Back</button>'+
  '<div class="card"><h2 class="qt">'+esc(TITLES[S.k])+'</h2><h3 class="sum">Answers</h3>'+ordNote()+searchBox()+qs+
  '<p style="margin-top:18px"><a href="#" id="fin" class="flink">Finish review</a></p></div>';
  $("back").onclick=function(){S.view="info";renderInfo();window.scrollTo(0,0);};
  $("fin").onclick=function(e){e.preventDefault();S.view="info";renderInfo();window.scrollTo(0,0);};
  bindSearch();
}
function renderReview(idx){
  if(idx===undefined)idx=H[S.k].length-1;
  var h=H[S.k][idx],n=tot(Q),G=mt(S.k).grade,sc=h.score,old=S.ans;S.ans=h.ans;
  var rows=[["Started on",dt(h.started)],["State","Finished"],["Completed on",dt(h.completed)],
    ["Time taken",Math.floor(h.secs/60)+" mins "+(h.secs%60)+" secs"],
    ["Marks",sc.toFixed(2)+"/"+n.toFixed(2)],["Grade",(sc/n*G).toFixed(2)+" out of "+G.toFixed(2)+" ("+Math.round(sc/n*100)+"%)"]];
  var qs=Q.map(function(q,i){
    var ok=correct(i);
    return '<div class="rq"><div class="rinfo"><div class="rn">Question <b>'+(i+1)+'</b></div>'+
      '<div class="rs">'+(ok?"Correct":(answered(i)?"Incorrect":"Not answered"))+'</div>'+
      '<div class="rm">Mark '+(ok?(q.w||1):0).toFixed(2)+' out of '+(q.w||1).toFixed(2)+'</div></div>'+
      '<div class="rbody"><p>'+esc(q.t)+'</p>'+(q.fig||"")+revBody(q,i)+'</div></div>';
  }).join("");
  root.innerHTML=
  '<button class="btn back" id="back" type="button">Back</button>'+
  '<div class="card"><h2 class="qt">'+esc(TITLES[S.k])+'</h2><h3 class="sum">Review of attempt '+(idx+1)+'</h3>'+(S.ans=old,"")+
  '<table class="rt">'+rows.map(function(r){return '<tr><th>'+r[0]+'</th><td>'+r[1]+'</td></tr>';}).join("")+'</table>'+
  ordNote()+searchBox()+qs+'<p style="margin-top:18px"><a href="#" id="fin" class="flink">Finish review</a></p></div>';
  $("back").onclick=function(){S.view="info";renderInfo();window.scrollTo(0,0);};
  $("fin").onclick=function(e){e.preventDefault();S.view="info";renderInfo();window.scrollTo(0,0);};
  bindSearch();
}
function renderResult(){
  var used=TOTAL-S.left;
  root.innerHTML=
  '<button class="btn back" id="back" type="button">Back to course</button>'+
  '<div class="card"><h2 class="qt">Attempt finished</h2>'+
  (S.timeUp?'<p>Time is up. Your attempt was submitted automatically.</p>':'')+
  '<div class="meta"><span>'+TITLES[S.k]+'</span><span>Time taken: '+Math.floor(used/60)+' min '+(used%60)+' secs</span></div>'+
  '<p class="score">'+S.score+' / '+tot(Q)+' <span style="font-size:18px;color:var(--muted)">('+Math.round(S.score/tot(Q)*100)+'%)</span></p>'+
  '<div class="rev">'+Q.map(function(q,i){var ok=correct(i);
    return '<div class="it '+(ok?"ok":"no")+'"><span class="tag">Question '+(i+1)+' &middot; '+(ok?"Correct":"Incorrect")+'</span>'+
    '<p>'+esc(q.t)+'</p><p><b>Your answer:</b> '+esc(show(i))+'</p>'+(ok?"":'<p><b>Correct answer:</b> '+esc(right(i))+'</p>')+'</div>';}).join("")+'</div>'+
  '<div class="nav"><button class="btn ghost" id="retake" type="button">Retake quiz</button><button class="btn primary" id="course" type="button">Return to course</button></div></div>';
  $("back").onclick=function(){S.view="course";renderCourse();window.scrollTo(0,0);};
  $("course").onclick=$("back").onclick;
  $("retake").onclick=function(){A[S.k]=null;beginQuiz(S.k);};
}


/* ---------- Learning Task (Graph): figures ---------- */
function nums(n){var r=[];for(var i=1;i<=n;i++)r.push(String(i));return r;}
QS.dsa_lt1=[];

QS.dsa_q2=[];
META.dsa_q2={limit:"30 mins",secs:1800,method:"Highest grade",pass:"Not specified",grade:10};
/* ---------------- Supabase: quizzes + attempts ---------------- */
var sb=null;
var ME=null;
function renderPending(st){
  var rej=st==="rejected",nm=esc((ME.user_metadata&&ME.user_metadata.full_name)||ME.email);
  root.innerHTML='<div class="card"><h2 class="qt">'+(rej?"Access declined":"Waiting for approval")+'</h2><p style="font-size:16px;max-width:60ch">'+(rej?"Your account request was not approved. Please contact your admin.":"Your account was created. The admin must review and approve it. Check back soon.")+'</p><p style="font-size:16px">Name submitted: <b>'+nm+'</b></p><p style="font-size:14px;color:#7b7f92;max-width:60ch">Make sure this is your complete real name.</p></div>';
  setInterval(function(){sb.from("profiles").select("status").eq("user_id",ME.id).maybeSingle().then(function(r){if(r.data&&r.data.status==="approved")location.reload();});},10000);
}
function logEvent(kind){
  if(!sb||!ME||!S.k)return;
  sb.from("events").insert({user_id:ME.id,student_name:(ME.user_metadata&&ME.user_metadata.full_name)||ME.email,quiz_slug:S.k,kind:kind}).then(function(){},function(){});
}
document.addEventListener("visibilitychange",function(){if(document.hidden&&S.view==="quiz"&&!S.finished)logEvent("tab_switch");});
function saveAttemptDB(){
  if(!sb||!ME)return;
  sb.from("attempts").insert({user_id:ME.id,quiz_slug:S.k,student_name:(ME.user_metadata&&ME.user_metadata.full_name)||ME.email,score:S.score,total:tot(Q),secs:TOTAL-S.left,answers:S.ans}).then(function(){},function(){});
}
function addBar(){
  var d=document.createElement("div");d.style.cssText="position:fixed;top:6px;left:12px;z-index:20;font-size:12px;background:#fff;color:#222436;border-radius:14px;padding:3px 4px 3px 12px;box-shadow:0 1px 4px #0003;display:flex;gap:8px;align-items:center";
  var n=document.createElement("span");n.textContent=(ME.user_metadata&&ME.user_metadata.full_name)||ME.email;
  var b=document.createElement("button");b.textContent="Sign out";b.style.cssText="background:#e6dff0;color:#6b4a8a;border-radius:10px;padding:3px 10px;font-size:12px";
  b.onclick=function(){sb.auth.signOut().then(function(){location.replace("login.html");});};
  d.appendChild(n);d.appendChild(b);document.body.appendChild(d);
  sb.rpc("is_admin").then(function(r){if(r.data){var a=document.createElement("a");a.href="admin.html";a.textContent="Admin";a.style.cssText="color:#6b4a8a;font-weight:600;text-decoration:none";d.insertBefore(a,b);}});
}
function loadDB(){
  if(!window.supabase||!window.SUPABASE_URL||/YOUR_/.test(window.SUPABASE_URL))return Promise.resolve();
  sb=sb||supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
  return sb.from("quizzes").select("slug,title,meta,questions(position,type,text,options,answer,weight,extra)").eq("published",true).then(function(r){
    if(r.error||!r.data)return;
    var known={};Object.keys(SECS).forEach(function(c){SECS[c].forEach(function(sec){sec.items.forEach(function(it){if(it.quiz)known[it.quiz]=1;});});});
    var extra=[];
    r.data.forEach(function(z){
      QS[z.slug]=z.questions.sort(function(a,b){return a.position-b.position;}).map(function(x){
        var q={t:x.text,type:x.type,a:x.answer};
        if(x.options!=null)q.o=x.options;
        if(x.weight>1)q.w=x.weight;
        return Object.assign(q,x.extra||{});
      });
      TITLES[z.slug]=z.title;
      if(z.meta&&z.meta.secs)META[z.slug]=z.meta;
      if(!H[z.slug])H[z.slug]=[];
      if(!known[z.slug])extra.push({id:z.slug,type:"quiz",quiz:z.slug,title:z.title,dates:[],state:"none"});
    });
    if(extra.length){SECTIONS.push({id:"extra",title:"More quizzes",items:extra});S.open.extra=true;}
  }).catch(function(){});
}
(function(){
  if(!window.supabase||!window.SUPABASE_URL||/YOUR_/.test(window.SUPABASE_URL)){renderHome();return;}
  sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
  sb.auth.getSession().then(function(r){
    if(!r.data.session){location.replace("login.html");return;}
    ME=r.data.session.user;addBar();
    Promise.all([sb.rpc("is_admin"),sb.from("profiles").select("status").eq("user_id",ME.id).maybeSingle()]).then(function(x){
      var st=x[1].data&&x[1].data.status;
      if(x[0].data||x[1].error||st==="approved"){loadDB().then(function(){renderHome();});}else{renderPending(st);}
    });
  });
})();
</script>
